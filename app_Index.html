<!-- ===== Recording Engine (khắc phục lỗi micro trên GAS iframe) ===== -->
<iframe
  id="reFrame"
  src=""
  style="display:none; width:100%; height:520px; border:0; border-radius:12px; margin-top:16px;"
  allow="microphone"
  title="TOEIC Recording Engine">
</iframe>

<script>
(function () {
  'use strict';

  var reFrame = document.getElementById('reFrame');
  var reReady = false;
  var rePendingQueue = [];

  // Nguồn URL Recording Engine (host trên GitHub Pages / Cloudflare Pages / v.v.)
  // Thay URL bên dưới bằng URL thực tế sau khi bạn deploy Recording Engine.
  var RECORDING_ENGINE_URL = '';

  function reLoad() {
    if (!reFrame) return;
    if (RECORDING_ENGINE_URL) {
      reFrame.src = RECORDING_ENGINE_URL;
    }
  }

  function reSend(msg) {
    if (!reFrame || !reFrame.contentWindow) {
      rePendingQueue.push(msg);
      return;
    }
    if (!reReady) {
      rePendingQueue.push(msg);
      return;
    }
    reFrame.contentWindow.postMessage(msg, '*');
    rePendingQueue = [];
  }

  function reFlushPending() {
    var q = rePendingQueue.splice(0, rePendingQueue.length);
    q.forEach(function (m) { reSend(m); });
  }

  // Lắng nghe RE_ENGINE_READY từ Recording Engine
  window.addEventListener('message', function (event) {
    var data = event.data || {};
    if (data.type === 'RE_ENGINE_READY') {
      reReady = true;
      reFlushPending();
    }
  });

  // Tự động load khi DOM sẵn sàng
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', reLoad);
  } else {
    reLoad();
  }

  // Expose để core.js gọi
  window.RE = {
    load: reLoad,
    send: reSend,
    setUrl: function (url) { RECORDING_ENGINE_URL = url; },
    isReady: function () { return reReady; }
  };
})();
</script>
