<script>
(function (global) {
  'use strict';

  /* ---------- CSS (inject vào head để không tạo nội dung ngoài #modeBody) ---------- */
  var CSS = [
    '.epi-unit-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}',
    '.epi-unit-btn{padding:6px 12px;border-radius:20px;border:1px solid rgb(var(--border));background:rgb(var(--card));cursor:pointer;font-size:13px;}',
    '.epi-unit-btn.active{background:rgb(var(--accent));color:#fff;border-color:rgb(var(--accent));}',
    '.epi-sentence{padding:8px 10px;border:1px solid rgb(var(--border));border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}',
    '.epi-sentence .epi-play{font-size:16px;cursor:pointer;flex-shrink:0;}',
    '.epi-answer{margin-top:6px;color:rgb(var(--muted-foreground));font-size:12px;white-space:pre-wrap;}',
    '.epi-ex{padding:10px 12px;border:1px solid rgb(var(--border));border-radius:10px;margin-bottom:10px;}',
    '.epi-ex button{margin-top:6px;}',
    '.epi-hidden{display:none;}',
    '.epi-record-row{display:flex;align-items:center;gap:8px;margin-top:6px;}',
    '.epi-score{font-weight:700;}',
    '.epi-head{margin:0 0 4px;font-size:22px;line-height:1.25;color:rgb(var(--foreground));}',
    '.epi-sub{color:rgb(var(--muted-foreground));font-size:13px;margin:0 0 10px;}',
  ].join('\n');

  function injectCss() {
    if (document.getElementById('epiStyle')) return;
    var s = document.createElement('style');
    s.id = 'epiStyle';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ---------- State ---------- */
  var S = { units: [], selected: 0, audioBase: '', reWin: null, reWinReady: false, rePending: null, rePoll: null };

  /* Recording Engine (popup top-level) — vì GAS iframe sandbox chặn microphone.
     Đây chính là cơ chế LPTD dùng: https://lfskcm2018.github.io/Toeic-lptd/recording-engine/ */
  var RE_URL_FALLBACK = 'https://lfskcm2018.github.io/Toeic-lptd/recording-engine/';

  function q(sel) { return document.querySelector(sel); }
  function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function host() {
    var el = q('#modeBody');
    if (!el) {
      el = document.createElement('div');
      el.id = 'modeBody';
      document.body.appendChild(el);
    }
    return el;
  }

  function reUrl() {
    var u = global.LPTD_RECORDING_ENGINE_URL || global.EPI_RECORDING_ENGINE_URL || RE_URL_FALLBACK;
    return String(u || '').trim() || RE_URL_FALLBACK;
  }

  function reOpen() {
    if (S.reWin && !S.reWin.closed) { try { S.reWin.focus(); } catch (e) {} return S.reWin; }
    S.reWin = null; S.reWinReady = false;
    S.reWin = global.open(reUrl(), 'epi_recording_engine', 'width=560,height=680,resizable=yes,scrollbars=yes');
    reStartPoll();
    return S.reWin;
  }

  function reSend(msg) {
    if (S.reWin && !S.reWin.closed) { try { S.reWin.postMessage(msg, '*'); } catch (e) {} }
  }

  function reStartPoll() {
    if (S.rePoll) return;
    S.rePoll = setInterval(function () {
      if (S.reWin && !S.reWin.closed) return;
      reStopPoll();
      S.reWin = null; S.reWinReady = false;
      if (S.rePending) {
        var el = document.getElementById('epi-score-' + S.rePending.idx);
        if (el) el.textContent = 'Đã đóng cửa sổ ghi âm — bấm Nói để mở lại';
        S.rePending = null;
      }
    }, 1000);
  }

  function reStopPoll() { if (S.rePoll) { clearInterval(S.rePoll); S.rePoll = null; } }

  /* Thông báo lỗi dễ hiểu cho người học. */
  function reErrorText(err) {
    if (err === 'not-allowed') {
      return 'Chưa được cấp quyền micro: hãy bấm biểu tượng 🔒 ở thanh địa chỉ của cửa sổ ghi âm, chọn “Cho phép”, rồi bấm Nói lại.';
    }
    if (err === 'unsupported') {
      return 'Trình duyệt không hỗ trợ nhận diện giọng nói — hãy dùng Chrome hoặc Edge.';
    }
    if (err === 'no-speech') {
      return 'Không nghe thấy giọng nói — hãy bấm Nói và đọc to câu.';
    }
    if (err === 'network') {
      return 'Lỗi mạng khi nhận diện giọng nói — kiểm tra kết nối rồi thử lại.';
    }
    return 'Lỗi nhận diện: ' + err;
  }

  /* Fallback: Web Speech trực tiếp trong trang (chạy được nếu mở app ngoài iframe GAS). */
  function inlineRecognize(idx, targetText) {
    var el = document.getElementById('epi-score-' + idx);
    var SR = global.SpeechRecognition || global.webkitSpeechRecognition;
    if (!SR) { if (el) el.textContent = 'Trình duyệt không hỗ trợ nhận diện giọng nói.'; return; }
    if (el) el.textContent = 'Đang nghe trực tiếp…';
    try {
      var rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = function (e) {
        var heard = e.results[0][0].transcript;
        if (el) el.textContent = similarity(heard, targetText) + '% — "' + heard + '"';
      };
      rec.onerror = function (e) { if (el) el.textContent = reErrorText(e.error); };
      rec.start();
    } catch (e) {
      if (el) el.textContent = 'Lỗi: ' + (e && e.message ? e.message : String(e));
    }
  }

  /* Bấm Nói → mở popup engine, yêu cầu nhận diện, nhận transcript về chấm %. */
  function reRequest(idx, targetText) {
    S.rePending = { idx: idx, targetText: targetText, sessionId: 'epi-' + Date.now() + '-' + idx };
    var el = document.getElementById('epi-score-' + idx);
    if (el) el.textContent = 'Đang mở cửa sổ ghi âm…';
    var w = reOpen();
    if (!w) {
      S.rePending = null;
      if (el) el.textContent = 'Trình duyệt chặn popup — đang thử nhận diện trực tiếp…';
      inlineRecognize(idx, targetText);
      return;
    }
    if (el) el.textContent = 'Hãy đọc to câu trong cửa sổ phụ…';
    if (S.reWinReady) reSendStart();
  }

  function reSendStart() {
    if (!S.rePending) return;
    var p = S.rePending;
    reSend({ type: 'START_RECOGNITION', sessionId: p.sessionId, itemIndex: p.idx, targetText: p.targetText });
  }

  function reHandleMessage(event) {
    var data = event.data;
    if (!data || typeof data.type !== 'string') return;
    if (!S.reWin || event.source !== S.reWin) return;
    var el = S.rePending ? document.getElementById('epi-score-' + S.rePending.idx) : null;
    if (data.type === 'RE_ENGINE_READY') {
      S.reWinReady = true;
      reSendStart();
      return;
    }
    if (data.type === 'RECOGNITION_READY') {
      var target = S.rePending ? S.rePending.targetText : '';
      var pct = similarity(data.transcript, target);
      if (el) el.textContent = pct + '% — "' + String(data.transcript || '') + '"';
      S.rePending = null;
      return;
    }
    if (data.type === 'RECOGNITION_ERROR') {
      if (el) el.textContent = reErrorText(data.error || 'không rõ');
      S.rePending = null;
      return;
    }
    if (data.type === 'RECORDING_ERROR') {
      if (el) el.textContent = 'Lỗi micro: ' + (data.error || 'không rõ');
      S.rePending = null;
    }
  }

  /* Chấm %: so từ đã nói với từ đích (cùng cách module LPTD chấm). */
  function similarity(said, target) {
    said = String(said || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
    target = String(target || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (!target.length) return 0;
    var copy = target.slice(), matched = 0;
    said.forEach(function (w) {
      var ix = copy.indexOf(w);
      if (ix !== -1) { matched++; copy.splice(ix, 1); }
    });
    return Math.round(matched / target.length * 100);
  }

  function showError(msg) {
    host().innerHTML = '<section class="card"><b>Lỗi:</b><br>' + esc(msg) + '</section>';
  }

  /* ---------- Render ---------- */
  function renderList() {
    var html = '';
    S.units.forEach(function (u, i) {
      html += '<button type="button" class="epi-unit-btn' + (i === S.selected ? ' active' : '') +
        '" data-idx="' + i + '">Unit ' + String(u.unit).padStart(2, '0') + '</button>';
    });
    q('#epiUnitList').innerHTML = html;
    qa('.epi-unit-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        S.selected = Number(b.getAttribute('data-idx'));
        renderContent();
      });
    });
  }

  function renderContent() {
    var u = S.units[S.selected];
    if (!u) { showError('Không có unit nào.'); return; }

    var html = '';
    html += '<section class="card">'
      + '<h2 class="epi-head">Unit ' + String(u.unit).padStart(2, '0') + ' — ' + esc(u.title) + '</h2>'
      + '<p class="epi-sub">' + esc(u.focus) + ' · Âm: ' + esc(u.sounds) + '</p>'
      + '<p>' + esc(u.explanation) + '</p>'
      + '</section>';

    html += '<section class="card"><h3 class="epi-head" style="font-size:18px">🎧 Nghe & nói</h3>';
    u.sentences.forEach(function (s, idx) {
      html += '<div class="epi-sentence">'
        + '<button type="button" class="btn btn-outline btn-sm epi-play" data-audio="' + idx + '" title="Phát audio">▶️</button>'
        + '<span style="flex:1;min-width:180px">' + esc(s) + '</span>'
        + '<span class="epi-record-row">'
        + '<button type="button" class="btn btn-outline btn-sm epi-speak" data-idx="' + idx + '" data-text="' + esc(s) + '">🎤 Nói</button>'
        + '<span class="epi-score" id="epi-score-' + idx + '"></span>'
        + '</span></div>';
    });
    html += '<p class="epi-sub" style="margin-top:10px">🎤 Nói: mở cửa sổ ghi âm phụ — hãy chọn “Cho phép” micro khi trình duyệt hỏi (chỉ cần làm 1 lần).</p>';
    html += '</section>';

    html += '<section class="card"><h3 class="epi-head" style="font-size:18px">📝 Exercises</h3>';
    u.exercises.forEach(function (ex) {
      html += '<div class="epi-ex">'
        + '<b>Exercise ' + esc(ex.n) + '</b><br>'
        + esc(ex.prompt)
        + '<div><button type="button" class="btn btn-outline btn-sm epi-reveal">Xem đáp án</button></div>'
        + '<div class="epi-answer epi-hidden">' + esc(ex.answer) + '</div>'
        + '</div>';
    });
    html += '</section>';

    host().innerHTML = '<div class="lptd-app">'
      + '<div id="epiUnitList" class="epi-unit-list"></div>'
      + '<div id="epiContent">' + html + '</div>'
      + '</div>';

    renderList();
    bindContent();
  }

  function bindContent() {
    qa('.epi-play').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-audio'));
        var u = S.units[S.selected];
        var src = u && u.audioTracks ? u.audioTracks[idx] : '';
        if (!src) { alert('Chưa có audio cho câu này.'); return; }
        btn.textContent = '⏸';
        var audio = new Audio(src);
        audio.onended = function () { btn.textContent = '▶️'; };
        audio.onerror = function () { btn.textContent = '⚠️'; };
        audio.play().catch(function () { btn.textContent = '▶️'; });
      });
    });

    qa('.epi-reveal').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var ans = btn.parentNode.nextElementSibling;
        if (ans) ans.classList.toggle('epi-hidden');
      });
    });

    qa('.epi-speak').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var text = btn.getAttribute('data-text') || '';
        var idx = Number(btn.getAttribute('data-idx'));
        var scoreEl = btn.parentNode.querySelector('.epi-score');
        /* GAS iframe sandbox không có allow="microphone" → Web Speech bị chặn (not-allowed).
           Dùng Recording Engine (popup top-level) — cùng cơ chế với module LPTD. */
        reRequest(idx, text);
        if (scoreEl && !scoreEl.textContent) scoreEl.textContent = 'Đang mở cửa sổ ghi âm…';
      });
    });
  }

  function apply(res) {
    if (!res || !Array.isArray(res.lessons)) {
      showError('Dữ liệu EPI không hợp lệ: ' + JSON.stringify(res).slice(0, 300));
      return;
    }
    S.audioBase = res.cdnBase || '';
    S.units = res.lessons;
    S.selected = 0;
    renderContent();
    var st = document.getElementById('heroStatus');
    if (st) st.textContent = '✅ Sẵn sàng';
  }

  function load() {
    var runner = global.google && global.google.script && global.google.script.run;
    if (!runner) { showError('Không tìm thấy google.script.run.'); return; }
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      showError('Timeout: không nhận được dữ liệu từ server sau 12 giây.');
    }, 12000);

    runner.withSuccessHandler(function (res) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { apply(res); } catch (e) { showError('Lỗi khi render: ' + (e && e.message ? e.message : String(e))); }
    }).withFailureHandler(function (e) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      showError('Lỗi từ server: ' + (e && e.message ? e.message : String(e)));
    }).getEPIBootstrap();
  }

  function boot() {
    injectCss();
    global.addEventListener('message', reHandleMessage);
    load();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);
</script>
