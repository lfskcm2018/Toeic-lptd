<!-- ===== Recording Engine (dùng popup, không dùng iframe để tránh sandbox) ===== -->
<script>
(function () {
  'use strict';

  // Nguồn URL Recording Engine (GitHub Pages)
  // URL: https://lfskcm2018.github.io/Toeic-lptd/recording-engine/
  var RECORDING_ENGINE_URL = 'https://lfskcm2018.github.io/Toeic-lptd/recording-engine/';

  // Biến lưu cửa sổ popup (nếu có)
  var reWin = null;

  /**
   * Mở popup chứa Recording Engine.
   * Nếu đã có popup sẵn, thì focus lại.
   * @param {string} sessionId - ID phiên ghi âm (dùng để nhận thức trước)
   * @param {number} itemIndex - Số đơn vị hiện tại (LPTD 1-4, 1-40)
   */
  function openRecordingEngine(sessionId, itemIndex) {
    if (reWin && !reWin.closed) {
      reWin.focus();
      return reWin;
    }

    var url = RECORDING_ENGINE_URL;
    if (sessionId != null) {
      url += (url.indexOf('?') === -1 ? '?' : '&') + 'sessionId=' + encodeURIComponent(sessionId);
    }
    if (itemIndex != null) {
      url += (url.indexOf('?') === -1 ? '?' : '&') + 'itemIndex=' + encodeURIComponent(itemIndex);
    }

    try {
      reWin = window.open(url, '_blank', 'width=900,height=700,resizable=yes,scrollbars=yes,status=yes');
    } catch (e) {
      alert('Không mở được Recording Engine: ' + e.message);
      return null;
    }

    // Đợi popup khởi động xong (timeout)
    setTimeout(function () {
      if (reWin && !reWin.closed) {
        reWin.focus();
        // Gửi lệnh bắt đầu ghi âm ngay sau khi popup xuất hiện
        setTimeout(function () {
          if (reWin && !reWin.closed) {
            reWin.postMessage({
              type: 'START_RECORDING',
              sessionId: sessionId,
              itemIndex: itemIndex
            }, '*');
          }
        }, 600);
      }
    }, 400);

    return reWin;
  }

  // Expose để LptdUI.html / LptdData.gs gọi
  window.RE = {
    open: openRecordingEngine,
    isOpen: function () { return reWin ? !reWin.closed : false; }
  };

})();
</script>

<script>
(function () {
  'use strict';
  /* Theme sáng/tối — độc lập, chỉ lưu localStorage trình duyệt. */
  var KEY = 'toeic_lptd_theme';
  var btn = document.getElementById('btnTheme');
  function apply(theme) {
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === 'dark' ? 'dark' : 'light');
  if (btn) {
    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
    });
  }
})();
</script>
